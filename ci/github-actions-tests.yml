name: Recovery Guard tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: find src tests examples ports tools \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
      - name: Policy and journal integration
        run: php tests/integration.php
      - name: Adversarial FastCGI transport
        run: php tests/fastcgi.php
      - name: Network collectors and baseline
        run: php tests/network.php
      - name: Native configuration and local routes
        run: php tests/configuration.php
      - name: Joined runtime and bounded log sampling
        run: php tests/runtime.php
      - name: Native snapshot projection
        run: php tests/snapshot.php
      - name: Durable diagnostic records and action ordering
        run: php tests/diagnostics.php
      - name: Final reboot fault reconfirmation
        run: php tests/reboot-verifier.php
      - name: Stage complete port and test config adapter
        run: |
          php tools/stage-port.php
          php tests/native-config.php
      - name: Original pfSense XML round trip
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/pfsense/pfsense/9363ac5b8651a1c7a333180425ce7719070f95f9/src/etc/inc/xmlparse.inc -o "$RUNNER_TEMP/pfsense-xmlparse.inc"
          php tests/native-xml.php "$RUNNER_TEMP/pfsense-xmlparse.inc"
      - name: Simulated incident
        run: php examples/replay-outage.php
